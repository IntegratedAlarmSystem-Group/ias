##
############################ IAS  ############################# 
##
## These properties, but auto.create.topics.enable,
## are set for testing purposes only.
## This is not intended for production.
##
## iasMergeProps merge the default properites with the ones 
## of this file
##


## Required by IAS
auto.create.topics.enable=true 

delete.topic.enable=true 

log.dirs=/var/lib/kafkadata 

# The number of hours to keep a log file before deleting it (in hours), tertiary to log.retention.ms property 

# The default is 168 
log.retention.hours=1

# Creates a new segment every 5 minutes
# @see https://github.com/IntegratedAlarmSystem-Group/ias/issues/97
log.roll.ms=300000

offsets.retention.check.interval.ms=60000 

offsets.retention.minutes=5 
