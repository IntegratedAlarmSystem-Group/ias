syntax = "proto3";
package pytf;

option java_package = "org.eso.ias.generated.protobuf.tfservice";
option java_outer_classname = "PytfService";

import "types.proto";

service PyTfService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  rpc Eval(EvalRequest) returns (EvalResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  bool success = 1;
}

message IasioInfoProto {
  string id = 1;
  ias.types.IASType iasType = 2;
}

message IasIO {
  string iasId = 1;
  string runningId = 2;
  ias.types.OperationalMode mode = 3;
  ias.types.IASType iasType = 4;
  ias.types.Validity validity = 5;
  ias.types.Value value = 6;
  int64 productionTStamp = 7;
  map<string, string> props = 8;
  int64 readFromMonSysTStamp = 9;
  int64 sentToConverterTStamp = 10;
  int64 receivedFromPluginTStamp = 11;
  int64 convertedProductionTStamp = 12;
  int64 sentToBsdbTStamp = 13;
  int64 readFromBsdbTStamp = 14;
}

message InitializeRequest {
  string asceRunningId = 1;
  string asceId = 2;
  string pythonClassName = 3;
  int64 validityTimeFrame = 4;
  map<string, string> props = 5;
  optional string templateInstance = 6;
  repeated IasioInfoProto inputsInfo = 7;
  IasioInfoProto outputInfo = 8;
}

message InitializeResponse {
  bool success = 1;
  string error = 2;
}

message EvalRequest {
  string asceRunningId = 1;
  map<string, IasIO> compInputs = 2;
  IasIO actualOutput = 3;
}

message EvalResponse {
  bool success = 1;
  string error = 2;
  IasIO result = 3;
}

message ShutdownRequest {
  string asceRunningId = 1;
}

message ShutdownResponse {
  bool success = 1;
  string error = 2;
}
