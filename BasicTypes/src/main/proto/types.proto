syntax = "proto3";

package ias.types;

option java_package = "org.eso.ias.generated.protobuf.iastypes";
option java_outer_classname = "IasTypes";

enum IASType {
  IASTYPE_LONG = 0;
  IASTYPE_INT = 1;
  IASTYPE_SHORT = 2;
  IASTYPE_BYTE = 3;
  IASTYPE_DOUBLE = 4;
  IASTYPE_FLOAT = 5;
  IASTYPE_BOOLEAN = 6;
  IASTYPE_CHAR = 7;
  IASTYPE_STRING = 8;
  IASTYPE_TIMESTAMP = 9;
  IASTYPE_ARRAYOFDOUBLES = 10;
  IASTYPE_ARRAYOFLONGS = 11;
  IASTYPE_ALARM = 12;
}

enum Validity {
  VALIDITY_RELIABLE = 0;
  VALIDITY_UNRELIABLE = 1;
}

enum OperationalMode {
  OPERATIONALMODE_CLOSING = 0;
  OPERATIONALMODE_DEGRADED = 1;
  OPERATIONALMODE_INITIALIZATION = 2;
  OPERATIONALMODE_MAINTENANCE = 3;
  OPERATIONALMODE_OPERATIONAL = 4;
  OPERATIONALMODE_SHUTTEDDOWN = 5;
  OPERATIONALMODE_STARTUP = 6;
  OPERATIONALMODE_UNKNOWN = 7;
  OPERATIONALMODE_MALFUNCTIONING = 8;
}

enum AlarmState {
  ALARMSTATE_CLEAR_ACK = 0;
  ALARMSTATE_CLEAR_UNACK = 1;
  ALARMSTATE_SET_UNACK = 2;
  ALARMSTATE_SET_ACK = 3;
}

enum Priority {
  PRIORITY_LOW = 0;
  PRIORITY_MEDIUM = 1;
  PRIORITY_HIGH = 2;
  PRIORITY_CRITICAL = 3;
}
