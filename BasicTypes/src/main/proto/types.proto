syntax = "proto3";

package ias.types;

option java_package = "org.eso.ias.generated.protobuf.iastypes";
option java_outer_classname = "IasTypes";

enum IASType {
  LONG = 0;
  INT = 1;
  SHORT = 2;
  BYTE = 3;
  DOUBLE = 4;
  FLOAT = 5;
  BOOLEAN = 6;
  CHAR = 7;
  STRING = 8;
  TIMESTAMP = 9;
  ARRAYOFDOUBLES = 10;
  ARRAYOFLONGS = 11;
  ALARM = 12;
}

enum Validity {
  RELIABLE = 0;
  UNRELIABLE = 1;
}

enum OperationalMode {
  CLOSING = 0;
  DEGRADED = 1;
  INITIALIZATION = 2;
  MAINTENANCE = 3;
  OPERATIONAL = 4;
  SHUTTEDDOWN = 5;
  STARTUP = 6;
  UNKNOWN = 7;
  MALFUNCTIONING = 8;
}

enum AlarmState {
  CLEAR_ACK = 0;
  CLEAR_UNACK = 1;
  SET_UNACK = 2;
  SET_ACK = 3;
}

enum Priority {
  LOW = 0;
  MEDIUM = 1;
  HIGH = 2;
  CRITICAL = 3;
}

// ---- Messages ----

message DoubleArray {
  repeated double values = 1;
}

message Int64Array {
  repeated int64 values = 1;
}

message Alarm {
  AlarmState state = 1;
  Priority priority = 2;
}

message Value {
  oneof value {
    int64 int64Value = 1;              // LONG, INT, SHORT, BYTE, TIMESTAMP
    double doubleValue = 2;            // DOUBLE, FLOAT
    bool boolValue = 3;                // BOOLEAN
    string stringValue = 4;            // STRING, CHAR
    DoubleArray doubleArrayValue = 5;  // ARRAYOFDOUBLES
    Int64Array int64ArrayValue = 6;    // ARRAYOFLONGS
    Alarm alarmValue = 7;              // ALARM
  }
}


